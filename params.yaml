# params.yaml
# Every tunable value in the pipeline lives here, not inside the code.
# DVC watches this file: if a value used by a stage changes, `dvc repro`
# knows that stage (and everything after it) must be re-run.

data:
  raw_dir: data/raw          # original NASA text files (tracked by DVC, never edited)
  interim_dir: data/interim  # cleaned and labelled tables written by the ingest stage
  # We ingest all four subsets now. FD001 is used for training first;
  # FD002 to FD004 are kept for the drift-replay demo later.
  subsets: [FD001, FD002, FD003, FD004]

label:
  # An engine is labelled "at risk" (1) if it has this many cycles or fewer left.
  horizon: 30

features:
  input_dir: data/interim    # output of the ingest stage
  output_dir: data/features  # rolling-window features written by Spark
  # Chosen during EDA (see docs/eda_findings.md):
  # 6 flat sensors and the noisy s6 are dropped, leaving these 14.
  sensors: [s2, s3, s4, s7, s8, s9, s11, s12, s13, s14, s15, s17, s20, s21]
  # Rolling window in cycles. 5 was too noisy, 20 lagged behind (EDA Cell 6).
  window: 10

spark:
  # These control HOW Spark runs, not WHAT it computes, so the features
  # stage does not list them as params: changing them will not re-run it.
  master: "local[*]"       # run on this machine, using every CPU core
  driver_memory: 4g        # memory for Spark (laptop has 14 GB in total)
  shuffle_partitions: 12   # how many pieces to split work into (= CPU cores)
  local_dir: tmp/spark     # Spark scratch space, kept on the project drive

train:
  input_dir: data/features
  subset: FD001                 # train on FD001 only; other subsets are for the drift demo
  model_type: xgboost           # xgboost | random_forest | logistic_regression
  n_splits: 5                   # GroupKFold folds (split by engine, never by row)
  target_recall: 0.90           # pick the threshold that catches at least 90% of failures
  random_state: 42
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
  random_forest:
    n_estimators: 200
    min_samples_leaf: 5
  logistic_regression:
    C: 1.0

mlflow:
  tracking_uri: http://127.0.0.1:5000
  experiment_name: turbofan-failure-prediction
  registered_model_name: turbofan-failure-classifier

monitoring:
  # Data drift is measured with the Population Stability Index (PSI) of each of
  # the 14 sensors: recent readings vs the training data, 10 bins per sensor
  # (cut at the training data's deciles).
  psi_bins: 10
  # Values chosen by experiments/drift_threshold_study.py (100 random windows of
  # whole engines per case, see docs/monitoring_findings.md):
  #   normal FD001 test data: false alarms 49% at 1000 rows, 1% at 3000, 0% at 5000
  #   FD002 (new operating conditions): max PSI always above 4.2 -> 100% detected
  #   FD003 (second fault mode): detected in 87% (3000 rows) to 91% (5000 rows)
  drift_threshold: 1.0     # drift if the highest sensor PSI is above this
  min_rows: 3000           # below this PSI is unreliable (normal data reaches 4.0)
  window_rows: 5000        # PSI is computed on the most recent 5000 readings
  pushgateway_url: http://127.0.0.1:9091   # where pipeline jobs push their metrics
