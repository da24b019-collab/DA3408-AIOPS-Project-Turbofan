# dvc.yaml: the pipeline definition (this is the "DVC DAG" the rubric asks for).
# Each stage lists:
#   cmd    -> the command to run
#   deps   -> files it reads (code and data)
#   params -> keys from params.yaml it depends on
#   outs   -> files it produces (DVC caches and versions these)
# `dvc repro` re-runs a stage only if one of its deps or params changed.
# More stages (features, train, evaluate) will be added below this one.

stages:
  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - src/config.py
      - data/raw
    params:
      - data
      - label
    outs:
      - data/interim
    metrics:
      - reports/ingest_report.json:
          cache: false   # small file, keep it in Git so changes show up in diffs

  features:
    cmd: python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - src/features/feature_logic.py
      - src/config.py
      - data/interim
    params:
      - features   # sensors and window: changing them changes the output
    outs:
      - data/features
    metrics:
      - reports/features_report.json:
          cache: false
