# dvc.yaml: the pipeline definition (this is the "DVC DAG" the rubric asks for).
# Each stage lists:
#   cmd    -> the command to run
#   deps   -> files it reads (code and data)
#   params -> keys from params.yaml it depends on
#   outs   -> files it produces (DVC caches and versions these)
# `dvc repro` re-runs a stage only if one of its deps or params changed.

stages:
  ingest:
    cmd: python -m src.data.ingest
    deps:
      - src/data/ingest.py
      - src/config.py
      - data/raw
    params:
      - data
      - label
    outs:
      - data/interim
    metrics:
      - reports/ingest_report.json:
          cache: false   # small file, keep it in Git so changes show up in diffs

  features:
    cmd: python -m src.features.build_features
    deps:
      - src/features/build_features.py
      - src/features/feature_logic.py
      - src/monitoring/pipeline_metrics.py
      - src/config.py
      - data/interim
    params:
      - features   # sensors and window: changing them changes the output
    outs:
      - data/features
    metrics:
      - reports/features_report.json:
          cache: false

  train:
    # Needs the MLflow server running (see README). Logs the run to MLflow,
    # registers a new model version as "challenger", and keeps a local copy.
    cmd: python -m src.models.train
    deps:
      - src/models/train.py
      - src/models/evaluate.py
      - src/models/tracking.py
      - src/features/feature_logic.py
      - src/monitoring/drift.py
      - src/monitoring/pipeline_metrics.py
      - data/features
    params:
      - train
      - features.sensors
      - features.window
      - monitoring.psi_bins
    outs:
      - models/latest
    metrics:
      - reports/train_metrics.json:
          cache: false
