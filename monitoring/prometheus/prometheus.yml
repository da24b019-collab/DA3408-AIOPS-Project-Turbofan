# Prometheus configuration: WHAT to collect, and how often.
#
# Prometheus PULLS ("scrapes") metrics: every 15 s it visits each target's
# /metrics page and stores the numbers with a timestamp. Targets are given by
# container name, because Prometheus runs inside the same Docker network.

global:
  scrape_interval: 15s       # how often to read each target
  evaluation_interval: 15s   # how often to check the alert rules

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # ---- Our own application ----
  - job_name: backend            # FastAPI: requests, latency, predictions, drift (src/api/metrics.py)
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mlflow             # MLflow tracking server (started with --expose-prometheus)
    static_configs:
      - targets: ["mlflow:5000"]

  - job_name: pushgateway        # metrics pushed by the pipeline stages (features, train)
    honor_labels: true           # keep the stage's own job label (e.g. job="pdm_train")
    static_configs:
      - targets: ["pushgateway:9091"]

  # ---- Infrastructure ----
  - job_name: node               # the laptop itself: CPU, memory, disk, network
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor           # every container: CPU, memory, network
    scrape_interval: 30s         # cAdvisor pages are large; 30 s is enough
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Keep only this project's containers (named turbofan-...), not every
      # container on the machine, to keep Prometheus small.
      - source_labels: [name]
        regex: "turbofan-.*|"
        action: keep

  # ---- Uptime checks (black-box: "does it answer?") ----
  # Prometheus asks the blackbox exporter to call each URL; the exporter
  # reports probe_success (1 = answered with 2xx) and how long it took.
  - job_name: uptime
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8000/health
          - http://model-server:5001/ping
          - http://mlflow:5000/health
          - http://frontend:8501/_stcore/health
          - http://grafana:3000/api/health
    relabel_configs:
      # The URL becomes the ?target= parameter and the "instance" label,
      # and the request itself goes to the blackbox exporter.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # ---- The monitoring tools themselves ----
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
